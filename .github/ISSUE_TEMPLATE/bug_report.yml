name: Bug report
description: Report a reproducible problem without sharing keys or private media
body:
  - type: markdown
    attributes:
      value: Do not include API keys, personal data, private scripts, or unreleased media.
  - type: input
    id: version
    attributes:
      label: Reelori version
      placeholder: e.g. 0.4.0-preview.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux Docker
        - Other
